name: Firmware portable core tests
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'firmware/core/**'
      - 'firmware/esp-idf/**'
      - '.github/workflows/firmware-core-test.yml'
  pull_request:
    paths:
      - 'firmware/core/**'
      - 'firmware/esp-idf/**'
      - '.github/workflows/firmware-core-test.yml'
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware/core -B build/firmware-core
      - name: Build
        run: cmake --build build/firmware-core --parallel
      - name: Test
        run: ctest --test-dir build/firmware-core --output-on-failure
      - name: Build ESP32-C6 ESP-IDF application
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/firmware/esp-idf \
            espressif/idf:release-v5.4 idf.py build
      - name: Verify safe commissioning defaults
        run: |
          grep -q 'CONFIG_SBP_LOW_VOLTAGE_QUALIFY_MS 30000' firmware/esp-idf/build/config/sdkconfig.h
          grep -q 'CONFIG_SBP_RECOVERY_QUALIFY_MS 30000' firmware/esp-idf/build/config/sdkconfig.h
          grep -q 'CONFIG_SBP_SHUNT_MICRO_OHM 0' firmware/esp-idf/build/config/sdkconfig.h
          grep -q 'CONFIG_SBP_PROTECTION_ENABLE 0' firmware/esp-idf/build/config/sdkconfig.h

      - name: Upload ESP32-C6 build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbp-esp32c6-firmware
          if-no-files-found: error
          path: |
            firmware/esp-idf/build/*.bin
            firmware/esp-idf/build/bootloader/bootloader.bin
            firmware/esp-idf/build/partition_table/partition-table.bin
            firmware/esp-idf/build/flasher_args.json
            firmware/esp-idf/build/project_description.json
