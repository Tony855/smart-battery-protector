name: Backend service tests
on:
  push:
    paths:
      - 'backend/service/**'
      - 'backend/db/**'
      - 'backend/openapi.yaml'
      - 'backend/docker-compose.yml'
      - 'protocol/**'
      - '.github/workflows/backend-service-test.yml'
      - 'docs/DEVICE_AUTH_PROTOCOL.md'
      - 'docs/DEVICE_CREDENTIAL_SECURITY.md'
      - 'docs/POSTGRESQL_MIGRATION.md'
      - 'docs/IMPLEMENTATION_BATCH_18.md'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
  pull_request:
    paths:
      - 'backend/service/**'
      - 'backend/db/**'
      - 'backend/openapi.yaml'
      - 'backend/docker-compose.yml'
      - 'protocol/**'
      - '.github/workflows/backend-service-test.yml'
      - 'docs/DEVICE_AUTH_PROTOCOL.md'
      - 'docs/DEVICE_CREDENTIAL_SECURITY.md'
      - 'docs/POSTGRESQL_MIGRATION.md'
      - 'docs/IMPLEMENTATION_BATCH_18.md'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sbp
          POSTGRES_PASSWORD: sbp_ci_only
          POSTGRES_DB: sbp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbp -d sbp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SBP_TEST_DATABASE_URL: postgresql://sbp:sbp_ci_only@localhost:5432/sbp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend/service[test]' pyyaml pip-audit
      - name: Audit Python dependencies
        run: pip-audit --strict --skip-editable
      - name: Test
        run: pytest backend/service/tests
      - name: Validate OpenAPI YAML
        run: python -c "import yaml; yaml.safe_load(open('backend/openapi.yaml', encoding='utf-8'))"
      - name: Build API container
        run: docker build -f backend/service/Dockerfile -t sbp-api:test .
