name: Backend service tests
permissions:
  contents: read
on:
  push:
    paths:
      - 'backend/service/**'
      - 'backend/db/**'
      - 'backend/openapi.yaml'
      - 'backend/docker-compose.yml'
      - 'protocol/**'
      - '.github/workflows/backend-service-test.yml'
      - 'docs/DEVICE_AUTH_PROTOCOL.md'
      - 'docs/DEVICE_CREDENTIAL_SECURITY.md'
      - 'docs/POSTGRESQL_MIGRATION.md'
      - 'docs/IMPLEMENTATION_BATCH_*.md'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
  pull_request:
    paths:
      - 'backend/service/**'
      - 'backend/db/**'
      - 'backend/openapi.yaml'
      - 'backend/docker-compose.yml'
      - 'protocol/**'
      - '.github/workflows/backend-service-test.yml'
      - 'docs/DEVICE_AUTH_PROTOCOL.md'
      - 'docs/DEVICE_CREDENTIAL_SECURITY.md'
      - 'docs/POSTGRESQL_MIGRATION.md'
      - 'docs/IMPLEMENTATION_BATCH_*.md'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sbp
          POSTGRES_PASSWORD: sbp_ci_only
          POSTGRES_DB: sbp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbp -d sbp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SBP_TEST_DATABASE_URL: postgresql://sbp:sbp_ci_only@localhost:5432/sbp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install a built wheel, not an editable checkout. pip-audit must be able
          # to audit the installed distribution metadata in the same environment.
          pip install 'backend/service[test]' pyyaml pip-audit
      - name: Audit Python dependencies
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("backend/service/pyproject.toml").read_text())
          requirements = project["project"]["dependencies"] + project["project"]["optional-dependencies"]["test"]
          with tempfile.NamedTemporaryFile(mode="w", suffix=".txt", encoding="utf-8") as req:
              req.write(chr(10).join(requirements) + chr(10))
              req.flush()
              subprocess.run(["pip-audit", "--strict", "--requirement", req.name], check=True)
          PY
      - name: Test
        run: pytest backend/service/tests
      - name: Validate OpenAPI YAML
        run: python -c "import yaml; yaml.safe_load(open('backend/openapi.yaml', encoding='utf-8'))"
      - name: Build API container
        run: docker build -f backend/service/Dockerfile -t sbp-api:test .
