services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SBP_POSTGRES_DB:?Set SBP_POSTGRES_DB}
      POSTGRES_USER: ${SBP_POSTGRES_USER:?Set SBP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SBP_POSTGRES_PASSWORD:?Set a strong SBP_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sbp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sbp_redis_data:/data
volumes:
  sbp_postgres_data:
  sbp_redis_data:
