[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sbp-api"
version = "0.7.0"
description = "Smart Battery Protector API service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "psycopg[binary]>=3.2,<4", "cryptography>=42,<46", "redis>=5,<7", "PyJWT[crypto]>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
